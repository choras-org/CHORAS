# Builds each simulation method from its own tagged commit in the shared
# simulation-backend repo, instead of the local submodule checkout — for
# reproducing one specific validated combination of method versions.
#
# Each method's Dockerfile expects the whole simulation-backend repo as
# build context (it does e.g. `COPY dg_method /app/dg_method`), exactly like
# the base docker-compose.yml already provides. So this file only swaps the
# context to a pinned git tag of the whole repo — `dockerfile:` is left
# alone and keeps inheriting the base file's `<method>_method/Dockerfile`.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.release.yml --profile sim_method build
#
# docker-compose.yml is unchanged and still builds from the local submodule
# working tree for day-to-day dev.
services:
  de-method:
    build:
      context: https://github.com/choras-org/simulation-backend.git#de-v0.1.0

  dg-method:
    build:
      context: https://github.com/choras-org/simulation-backend.git#dg-v0.1.0

  pyroomacoustics-method:
    build:
      context: https://github.com/choras-org/simulation-backend.git#pyroomacoustics-v0.1.0

  sparrowpy-method:
    build:
      context: https://github.com/choras-org/simulation-backend.git#sparrowpy-v0.1.0

  misuka-method:
    build:
      context: https://github.com/choras-org/simulation-backend.git#misuka-v0.1.0

  modart-method:
    build:
      context: https://github.com/choras-org/simulation-backend.git#modart-v0.1.0
