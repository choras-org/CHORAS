[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choras"
version = "0.2.1"
requires-python = ">=3.11"
description = "Community hub for open source room acoustics simulation"

dependencies = [
]

[project.optional-dependencies]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
    "myst-parser",
    "sphinx-copybutton",
]

dev = ["choras[docs]", "bump-my-version>=1.3.0"]

[tool.setuptools]
# Explicitly declare that this distribution does not define packages.
packages = []

[tool.bumpversion]
current_version = "0.2.1"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
