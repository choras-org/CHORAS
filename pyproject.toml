[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choras"
version = "0.1.0"
requires-python = ">=3.11"
description = "Community hub for open source room acoustics simulation"

dependencies = [
]

[project.optional-dependencies]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
    "myst-parser",
    "sphinx-copybutton",
]

dev = ["choras[docs]"]

[tool.setuptools]
# Explicitly declare that this distribution does not define packages.
packages = []